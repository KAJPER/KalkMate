[project]
name = "kalkmate-fiscal-agent"
version = "0.1.0"
description = "Lokalny agent fiskalny KalkMate: paragony przez drukarkę POSNET (TCP/WiFi)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
posnet-simulator = "fiscal_agent.simulator:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fiscal_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
