; Samodzielne narzedzie testowe — WYLACZNIE do wizualnej oceny na prawdziwym
; OLED, ktora czcionka grecka najlepiej pasuje do integracji z glownym
; firmware. Nie jest czescia glownego firmware KalkMate, nie flashuje
; kalkulatora klienta produkcyjnie — to jednorazowy test bring-up.
;
; Flashuj TAK SAMO jak glowny firmware: przytrzymaj BOOT, wcisnij i pusc
; RESET, pusc BOOT (albo po prostu upload — ESP32-S3 z natywnym USB-C
; zwykle auto-resetuje).
;
; Podmien upload_port/monitor_port na swoj aktualny COM (Menedzer urzadzen).

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM14
monitor_port = COM14
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
lib_deps =
    olikraus/U8g2@>=2.35.0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
